# Pins a new oneload_agent commit and deploys it. oneload_agent's CI calls this after its main
# passes; run it by hand to roll the agent back:  gh workflow run agent-bump.yml -f sha=<commit>
name: Bump oneload-agent

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full oneload_agent commit id to pin
        required: true

permissions:
  contents: write # commit the new pin
  actions: write # start CI / Deploy

concurrency:
  group: agent-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check the commit id
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit id"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pin the commit
        run: uv add "oneload-agent @ https://github.com/team-onetruck/oneload_agent/archive/$SHA.tar.gz"
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "oneload-agent is already pinned to $SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Bump oneload-agent to ${SHA::7}"
          git push
          # Pushes made with the workflow token start no workflows, so start CI / Deploy explicitly.
          gh workflow run ci.yml --ref main
