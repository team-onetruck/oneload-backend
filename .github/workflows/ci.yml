name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # redeploy after changing a secret: gh workflow run ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hangil
          POSTGRES_PASSWORD: hangil
          POSTGRES_DB: hangil_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U hangil" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hangil:hangil@localhost:54329/hangil_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Self-hosted runner on macserver, registered to this repo with the "hangil" label.
    runs-on: [self-hosted, macOS, hangil]
    concurrency:
      group: deploy-macserver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: deploy/macserver/deploy.sh
        env:
          # Every repository secret becomes an environment variable of the API on macserver.
          REPO_SECRETS: ${{ toJSON(secrets) }}
