[project]
name = "oneload-backend"
version = "0.1.0"
description = "Hangil (한길) backend: sessions, maps, routing and the AI entry points for Seoul Station guidance"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.159.1",
    "networkx>=3.7",
    "oneload-agent",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
oneload-agent = { url = "https://github.com/team-onetruck/oneload_agent/archive/54c321f7d86f55f5d3178744088b2c3827d73914.tar.gz" }
