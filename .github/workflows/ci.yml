name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy without a backend change. oneload-app's CI starts this after its main passes (oneload_agent
  # goes through agent-bump.yml); after changing a secret, oneload-data or oneload-infra: gh workflow run ci.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hangil
          POSTGRES_PASSWORD: hangil
          POSTGRES_DB: hangil_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U hangil" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hangil:hangil@localhost:54329/hangil_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Checked out after linting so ruff never sees the data repo's own tooling.
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-data
          path: oneload-data
      - name: Current oneload-data loads with this code
        run: |
          uv run python -c "from pathlib import Path; from app.domain.mapdata import MapStore; \
          print([m.map_id + '@' + m.version for m in MapStore.load(Path('oneload-data/maps')).all()])"

  image:
    # Catches a broken Dockerfile on every push; the deploy builds its own image on the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hangil-api:ci .

  deploy:
    needs: [test, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Self-hosted runner on macserver (label "hangil"). This repo is public: fork PR workflows wait for
    # a maintainer's approval (all outside contributors), so never approve one that touches .github/.
    runs-on: [self-hosted, macOS, hangil]
    concurrency:
      group: deploy-macserver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-infra
          path: infra
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-data
          path: data
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-app
          path: web
      - run: infra/macserver/deploy.sh backend data web
        env:
          # Server settings: one repository secret per line, exposed to deploy.sh with an APP_ prefix.
          # Add a line here when the API needs a new setting; an unset secret is simply skipped.
          APP_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
